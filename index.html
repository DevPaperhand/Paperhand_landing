<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paperhand</title>
<meta name="description" content="Lock your tokens behind a price range. They unlock as it climbs. Non-custodial, on Robinhood Chain." />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2226%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%230A0A0A%22%2F%3E%3Cpath%20d%3D%22M0%2064%20L50%2052%20L100%2064%20V100%20H0%20Z%22%20fill%3D%22%23116B4D%22%2F%3E%3Cpath%20d%3D%22M0%2064%20L50%2052%20L100%2064%20L100%2068%20L50%2056%20L0%2068%20Z%22%20fill%3D%22%232E8C66%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --paper:#FAFAF7;
  --panel:#FFFFFF;
  --ink:#0A0A0A;
  --muted:#75756E;
  --rule:#E6E5DF;
  --soft:#F2F1EC;
  --free:#116B4D;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden;
  font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
html[lang^="zh"] body{font-family:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",ui-sans-serif,sans-serif;line-height:1.8}
html[lang^="zh"] h1,html[lang^="zh"] h2{letter-spacing:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.06}
h1{font-size:clamp(34px,6.4vw,68px)}
h2{font-size:clamp(20px,2.4vw,26px)}
h3{font-size:16px;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,28px)}

/* ----------------------------------------------------------------- intro */
.ph-intro{position:fixed;inset:0;z-index:999;background:var(--paper);display:grid;place-items:center;
  animation:phOut .5s var(--ease) 2.45s both}
.ph-intro .ph-stage{position:relative;width:min(360px,86vw);height:230px}
.ph-intro .ph-stack,.ph-intro .ph-badge,.ph-intro .ph-word{position:absolute;left:50%;top:50%}
.ph-intro .ph-stack{width:150px;transform:translate(-50%,-50%);animation:phStackOut .5s var(--ease) 1.05s both}
.ph-intro .ph-stack g{opacity:0;animation:phDrop .6s var(--ease) both}
.ph-intro .ph-stack g:nth-child(1){animation-delay:.10s}
.ph-intro .ph-stack g:nth-child(2){animation-delay:.24s}
.ph-intro .ph-stack g:nth-child(3){animation-delay:.38s}
.ph-intro .ph-stack g:nth-child(4){animation-delay:.52s}
.ph-intro .ph-badge{width:96px;opacity:0;animation:phBadge .7s var(--ease) 1.15s both}
.ph-intro .ph-rise{transform:translateY(46px);animation:phRise .8s var(--ease) 1.45s both}
.ph-intro .ph-word{transform:translate(-50%,44px);font-size:clamp(28px,7vw,36px);font-weight:700;letter-spacing:-.035em;
  white-space:nowrap;clip-path:inset(0 100% 0 0);animation:phWipe .6s var(--ease) 1.75s both}
@keyframes phDrop{from{opacity:0;transform:translateY(-38px)}to{opacity:1;transform:translateY(0)}}
@keyframes phStackOut{to{opacity:0;transform:translate(-50%,-50%) scale(.86)}}
@keyframes phBadge{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  to{opacity:1;transform:translate(-50%,calc(-50% - 24px)) scale(1)}}
@keyframes phRise{from{transform:translateY(46px)}to{transform:translateY(0)}}
@keyframes phWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes phOut{to{opacity:0;visibility:hidden}}

/* ------------------------------------------------------------------ orbs */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.o1{width:420px;height:420px;background:#C3DACD;left:-8%;top:4%;animation:d1 48s ease-in-out infinite}
.o2{width:340px;height:340px;background:#E8E1D0;right:-6%;top:0;animation:d2 60s ease-in-out infinite}
.o3{width:300px;height:300px;background:#DCE5DE;right:10%;top:52%;animation:d3 54s ease-in-out infinite}
@keyframes d1{50%{transform:translate3d(70px,50px,0) scale(1.14)}}
@keyframes d2{50%{transform:translate3d(-60px,60px,0) scale(1.08)}}
@keyframes d3{50%{transform:translate3d(-50px,-40px,0) scale(1.16)}}

/* ------------------------------------------------------------------- nav */
nav{position:sticky;top:0;z-index:30;background:rgba(250,250,247,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:12px;height:66px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.03em;font-size:18px}
.glyph{width:18px;height:18px;display:block;flex:none;overflow:visible}
.glyph{transition:transform .18s var(--ease)}
.glyph .fill{transition:transform .6s var(--ease)}
.logo:hover .glyph .fill{transform:translateY(-12px)}
.logo:active .glyph{transform:scale(.9)}
.logo.splash .glyph .fill{animation:splash .95s var(--ease)}
@keyframes splash{0%{transform:translateY(0)}38%{transform:translateY(-62px)}58%{transform:translateY(-55px)}100%{transform:translateY(0)}}
.live{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;opacity:0;transform:translateY(6px);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.live.in{opacity:1;transform:none}
.live span{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);background:var(--panel);
  border:1px solid var(--rule);border-radius:100px;padding:6px 13px;font-variant-numeric:tabular-nums}
.live b{color:var(--ink);font-weight:600}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--free);animation:blip 2.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.35;transform:scale(.8)}}
.bar .grow{flex:1}
/* the status pill: centred on its own line box, green, alive */
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
  height:30px;padding:0 13px 0 11px;line-height:1;white-space:nowrap;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--free);
  background:linear-gradient(180deg,#F2F8F4 0%,#E4F0E9 100%);
  border:1px solid #CFE3D8;border-radius:100px;
  box-shadow:inset 0 1px 0 #FFFFFF,0 6px 16px -10px rgba(17,107,77,.55);
  animation:chipIn .7s var(--ease) .25s both}
.chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--free);
  animation:ping 2.2s ease-out infinite}
.chip::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
  transform:translateX(-130%);animation:sheen 5s ease-in-out 1.4s infinite}
@keyframes chipIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(17,107,77,.5)}70%{box-shadow:0 0 0 7px rgba(17,107,77,0)}100%{box-shadow:0 0 0 0 rgba(17,107,77,0)}}
@keyframes sheen{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:100px;background:var(--panel);overflow:hidden}
.lang button{padding:6px 11px;font-size:13px;color:var(--muted);line-height:1.2;transition:background .16s,color .16s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cta{position:relative;display:inline-block;background:var(--ink);color:var(--paper);border-radius:100px;
  padding:10px 18px;font-size:14.5px;font-weight:600;overflow:hidden;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),opacity .16s,border-color .16s}
.cta:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(10,10,10,.6)}
.cta:active{transform:translateY(0) scale(.98);box-shadow:none}
.cta.light{background:var(--panel);color:var(--ink);border:1px solid var(--rule)}
.cta.light:hover{border-color:var(--ink)}
.cta.lg{padding:14px 26px;font-size:16px}
.cta.soon{opacity:.45;pointer-events:none}

/* ------------------------------------------------------------------ hero */
main{position:relative;z-index:1}
.hero{text-align:center;padding:clamp(48px,7vw,86px) 0 clamp(20px,3vw,32px);display:flex;flex-direction:column;align-items:center}
.hero h1{max-width:22ch;white-space:pre-line;text-wrap:balance}
.hero .lede{margin-top:18px;color:var(--muted);font-size:clamp(16px,1.8vw,19px);max-width:44ch}
.hero .row{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center}

/* ----------------------------------------------------------------- stage */
.stage{width:100%;max-width:640px;margin:clamp(14px,2.4vw,28px) auto clamp(8px,2vw,20px);position:relative}
#scene{width:100%;height:clamp(300px,42vh,420px);display:block;cursor:grab;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 84%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 84%,transparent 100%)}
#scene:active{cursor:grabbing}
.readout{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:6px}
.readout .price{font-size:26px;font-weight:700;letter-spacing:-.02em}
.readout .pct{font-size:14px;color:var(--free);font-weight:600}
.slider{margin:14px auto 0;max-width:420px;padding:0 4px}
.slider input{width:100%;-webkit-appearance:none;appearance:none;background:none;height:26px;cursor:ew-resize}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:99px;
  background:linear-gradient(90deg,var(--free) var(--fill,0%),var(--soft) var(--fill,0%))}
.slider input::-moz-range-track{height:6px;border-radius:99px;background:var(--soft)}
.slider input::-moz-range-progress{height:6px;border-radius:99px;background:var(--free)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);
  border:1.5px solid var(--ink);margin-top:-7px;box-shadow:0 2px 6px rgba(10,10,10,.18);transition:transform .14s var(--ease)}
.slider input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--panel);border:1.5px solid var(--ink)}
.slider input:active::-webkit-slider-thumb{transform:scale(1.15)}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:2px}
.caption{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
/* the controls sit in a tray cut into the panel: sunken, lit from above */
.deck{position:relative;max-width:480px;margin:2px auto 0;padding:16px 22px 12px;border-radius:20px;
  transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .6s var(--ease);will-change:transform;
  background:linear-gradient(180deg,#ECEBE5 0%,#F4F3EE 55%,#F7F6F2 100%);
  border:1px solid #E0DFD8;
  box-shadow:
    inset 0 3px 6px -2px rgba(10,10,10,.10),
    inset 0 1px 1px rgba(10,10,10,.05),
    inset 0 -1px 0 rgba(255,255,255,.95),
    0 1px 0 rgba(255,255,255,.95)}
.deck.tilting{transition:transform .12s linear}
.deck .readout{margin-top:0}
.deck .slider{margin-top:10px}
.deck .slider input::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,var(--free) var(--fill,0%),#FFFFFF var(--fill,0%));
  box-shadow:inset 0 1px 2px rgba(10,10,10,.12)}
.deck .slider input::-moz-range-track{background:#FFFFFF;box-shadow:inset 0 1px 2px rgba(10,10,10,.12)}
.deck .slider input::-webkit-slider-thumb{box-shadow:0 2px 6px rgba(10,10,10,.22),0 0 0 4px rgba(255,255,255,.7)}

/* --------------------------------------------------------------- content */
section{padding:clamp(64px,8vw,120px) 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,22px)}
.step{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:24px;
  transition:transform .22s var(--ease),box-shadow .26s var(--ease),border-color .2s}
.step:hover{transform:translateY(-4px);border-color:#D8D7CF;box-shadow:0 22px 40px -30px rgba(10,10,10,.5)}
.step .n{width:26px;height:26px;border-radius:9px;background:var(--soft);color:var(--muted);
  display:grid;place-items:center;font-size:13px;font-weight:600;margin-bottom:14px}
.step p{margin-top:6px;color:var(--muted);font-size:14.5px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:18px;overflow:hidden;margin-top:clamp(14px,2vw,22px)}
.fact{background:var(--panel);padding:20px 22px;transition:background .2s}
.fact:hover{background:var(--soft)}
.fact b{display:block;font-size:15px;font-weight:600}
.fact span{font-size:13.5px;color:var(--muted)}
.loop{margin-top:clamp(14px,2vw,22px);background:var(--panel);border:1px solid var(--rule);border-radius:18px;
  padding:clamp(22px,3vw,32px);display:grid;grid-template-columns:auto 1fr;gap:clamp(22px,4vw,48px);align-items:center}
.loop .big{text-align:center;flex:none}
.loop .big b{display:block;font-size:clamp(52px,8vw,88px);font-weight:700;letter-spacing:-.05em;line-height:.9;color:var(--free)}
.loop .big span{display:block;font-size:13px;color:var(--muted);margin-top:10px;max-width:16ch}
.loop .side h2{margin-bottom:18px;max-width:22ch}
.flow-wrap{position:relative}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.flow::before{content:"";position:absolute;left:6px;right:6px;top:7px;height:2px;background:var(--soft);border-radius:2px}
.flow .pulse{position:absolute;top:3px;left:0;width:10px;height:10px;border-radius:50%;background:var(--free);
  opacity:.9;animation:travel 4.2s var(--ease) infinite}
@keyframes travel{0%{left:2%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:96%;opacity:0}}
.flow li{position:relative;padding:26px 14px 0 0;font-size:14.5px;color:var(--muted)}
.flow li::before{content:"";position:absolute;top:2px;left:0;width:12px;height:12px;border-radius:50%;
  background:var(--panel);border:2px solid var(--rule)}
.flow li:last-child::before{border-color:var(--free)}
.flow li b{color:var(--ink);font-weight:600}
.closing{text-align:center;padding:clamp(80px,10vw,140px) 0 clamp(70px,8vw,110px)}
.closing h2{max-width:20ch;margin:0 auto}
.closing .row{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}

footer{border-top:1px solid var(--rule);padding:26px 0 40px;font-size:13.5px;color:var(--muted);position:relative;z-index:1}
.foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.foot .grow{flex:1}
.foot a{transition:color .16s}
.foot a:hover{color:var(--ink)}
.foot a.soon{opacity:.45;pointer-events:none}

/* --------------------------------------------------------------- reveals */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.06s}.reveal.d2{transition-delay:.12s}.reveal.d3{transition-delay:.18s}

@media (max-width:900px){
  .steps{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .loop{grid-template-columns:1fr;gap:24px;text-align:center}
  .loop .big span{margin-left:auto;margin-right:auto}
  .loop .side h2{margin-left:auto;margin-right:auto}
  .flow-wrap{max-width:420px;margin:0 auto}
  .flow{grid-template-columns:1fr;gap:14px;text-align:left}
  .flow::before{left:5px;right:auto;top:6px;bottom:6px;width:2px;height:auto}
  .flow .pulse{animation:travelY 4.2s var(--ease) infinite;left:0}
  @keyframes travelY{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}
  .flow li{padding:0 0 0 26px}
  .flow li::before{top:4px}
}
@media (max-width:620px){
  .bar{gap:8px}
  .hero .row{width:100%}
  .hero .row .cta{flex:1;text-align:center}
  .facts{grid-template-columns:1fr}
}
@media (max-width:420px){ .chip{display:none} }
@media (prefers-reduced-motion:reduce){ .chip,.chip::before,.chip::after{animation:none!important}  .deck{transform:none!important}
  *{transition:none!important;animation:none!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="ph-intro" id="ph-intro" aria-hidden="true">
  <div class="ph-stage">
    <svg class="ph-stack" viewBox="0 0 160 150"></svg>
    <svg class="ph-badge" viewBox="0 0 100 100">
      <defs><clipPath id="sq2"><path d="M26,0 H74 C90,0 100,10 100,26 V74 C100,90 90,100 74,100 H26 C10,100 0,90 0,74 V26 C0,10 10,0 26,0 Z"/></clipPath></defs>
      <g clip-path="url(#sq2)">
        <rect width="100" height="100" fill="#0A0A0A"/>
        <g class="ph-rise">
          <path d="M0 64 L50 52 L100 64 V220 H0 Z" fill="#116B4D"/>
          <path d="M0 64 L50 52 L100 64 L100 68 L50 56 L0 68 Z" fill="#2E8C66"/>
        </g>
      </g>
    </svg>
    <div class="ph-word">paperhand</div>
  </div>
</div>

<div class="orbs" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<nav>
  <div class="wrap bar">
    <a class="logo" href="#top"><svg class="glyph" viewBox="0 0 100 100" aria-hidden="true">
        <defs><clipPath id="sq"><path d="M26,0 H74 C90,0 100,10 100,26 V74 C100,90 90,100 74,100 H26 C10,100 0,90 0,74 V26 C0,10 10,0 26,0 Z"/></clipPath></defs>
        <g clip-path="url(#sq)">
          <rect width="100" height="100" fill="#0A0A0A"/>
          <g class="fill">
            <path d="M0 64 Q25 58 50 52 Q75 58 100 64 V220 H0 Z" fill="#116B4D"><animate class="wave" attributeName="d" dur="1.8s" repeatCount="indefinite" begin="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="M0 64 Q25 58 50 52 Q75 58 100 64 V220 H0 Z;M0 60 Q25 50 50 58 Q75 66 100 58 V220 H0 Z;M0 65 Q25 67 50 56 Q75 47 100 61 V220 H0 Z;M0 64 Q25 58 50 52 Q75 58 100 64 V220 H0 Z"/></path>
            <path d="M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z" fill="#2E8C66"><animate class="wave" attributeName="d" dur="1.8s" repeatCount="indefinite" begin="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z;M0 60 Q25 50 50 58 Q75 66 100 58 L100 62 Q75 70 50 62 Q25 54 0 64 Z;M0 65 Q25 67 50 56 Q75 47 100 61 L100 65 Q75 51 50 60 Q25 71 0 69 Z;M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z"/></path>
          </g>
        </g>
      </svg>paperhand</a>
    <div class="grow"></div>
    <span class="chip" data-t="nav.status"></span>
    <div class="lang" id="lang">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <a class="cta" data-link="app" data-t="nav.app"></a>
  </div>
</nav>

<main id="top">
  <div class="wrap hero">
    <h1 data-t="hero.h1"></h1>
    <p class="lede" data-t="hero.lede"></p>
    <div class="row">
      <a class="cta lg" data-link="app" data-t="hero.cta1"></a>
      <a class="cta lg light" href="#how" data-t="hero.cta2"></a>
    </div>
    <div class="live" id="live" hidden></div>

    <div class="stage">
      <canvas id="scene"></canvas>

const I18N = {
en: {

/* --------------------------------------------------------------- intro */
(function(){
  const el = document.getElementById("ph-intro");
  if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem("ph-intro") === "1"; } catch {}
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (seen || reduce){ el.remove(); return; }

/* ---------------------------------------------------------- live stats
   Read straight from Robinhood Chain with one batched call. No library, no
   API. If the node does not answer, the strip simply never appears: the page
   never shows a zero it did not read.                                        */
(function(){
  const RPC = "https://rpc.mainnet.chain.robinhood.com";
  const VAULT = "0xb809C142B5c4D372D54aC928Ceb353d346C5f72F";
  const ASSETS = [
    ["0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC", "0x379EC4f7C378F34a1B47E4F3cbeBCbAC3E8E9F15"],
    ["0xaF3D76f1834A1d425780943C99Ea8A608f8a93f9", "0x6B22A786bAa607d76728168703a39Ea9C99f2cD0"],
    ["0x322F0929c4625eD5bAd873c95208D54E1c003b2d", "0x4A1166a659A55625345e9515b32adECea5547C38"],
    ["0xe93237C50D904957Cf27E7B1133b510C669c2e74", "0x45C3C877C15E6BA2EBB19eA114Ea508d14C1Af2E"],
    ["0x117cc2133c37B721F49dE2A7a74833232B3B4C0C", "0x319724394D3A0e3669269846abE664Cd621f9f6A"]
  ];
  const pad = a => a.toLowerCase().replace("0x", "").padStart(64, "0");
  const calls = [{ to: VAULT, data: "0x18160ddd" }, { to: VAULT, data: "0x12ac1763" }];
  for (const [token, feed] of ASSETS){
    calls.push({ to: token, data: "0x70a08231" + pad(VAULT) });
    calls.push({ to: feed, data: "0xfeaf968c" });
  }
  const body = calls.map((c, i) => ({ jsonrpc: "2.0", id: i, method: "eth_call", params: [c, "latest"] }));
  const word = (hex, n) => BigInt("0x" + (hex || "0x").slice(2 + n * 64, 2 + (n + 1) * 64) || "0");

  fetch(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      const by = {}; for (const r of res) if (r && r.result) by[r.id] = r.result;
      if (!by[0] || !by[1]) return;
      const open = Number(word(by[0], 0));
      let tvl = 0;
      ASSETS.forEach((_, i) => {
        const bal = by[2 + i * 2], px = by[3 + i * 2];
        if (!bal || !px) return;
        tvl += Number(word(bal, 0)) / 1e18 * Number(word(px, 1)) / 1e8;
      });
      const loc = lang === "zh" ? "zh-CN" : "en-US";
      const el = document.getElementById("live");
      el.innerHTML =
        '<span><i class="dot"></i>' + t("live.on") + "</span>" +
        "<span><b>" + open.toLocaleString(loc) + "</b> " + t(open === 1 ? "live.open1" : "live.open") + "</span>" +
        "<span><b>$" + tvl.toLocaleString(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "</b> " + t("live.tvl") + "</span>";
      el.hidden = false;
      requestAnimationFrame(() => el.classList.add("in"));
    })
    .catch(() => {});
})();

/* ------------------------------------------------------------ liquid logo */
(function(){
  const logo = document.querySelector(".logo");
  if (!logo) return;
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const waves = [...logo.querySelectorAll("animate.wave")];
  if (!still){
    logo.addEventListener("mouseenter", () => waves.forEach(a => { try { a.beginElement(); } catch {} }));
    logo.addEventListener("mouseleave", () => waves.forEach(a => { try { a.endElement(); } catch {} }));
  }
  logo.addEventListener("click", () => {
    if (still) return;
    logo.classList.remove("splash"); void logo.getBoundingClientRect(); logo.classList.add("splash");
  });
  logo.addEventListener("animationend", () => logo.classList.remove("splash"));
})();

/* ------------------------------------------------------------ frame tilt
   The panel leans a couple of degrees toward the cursor. It holds still while
   a finger or the mouse is down, so dragging the price or the vault never
   fights the tilt.                                                          */
(function(){
  const el = document.querySelector(".deck");
  if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (window.matchMedia("(hover: none)").matches) return;
  let held = false;
  el.addEventListener("pointerdown", () => { held = true; });
  window.addEventListener("pointerup", () => { held = false; });
  el.addEventListener("pointermove", e => {
    if (held) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    el.classList.add("tilting");
    el.style.setProperty("--ry", (x * 5).toFixed(2) + "deg");
    el.style.setProperty("--rx", (-y * 6).toFixed(2) + "deg");
  });
  el.addEventListener("pointerleave", () => {
    el.classList.remove("tilting");
    el.style.setProperty("--rx", "0deg"); el.style.setProperty("--ry", "0deg");
  });
})();

/* ------------------------------------------------------------- reveals */
if ("IntersectionObserver" in window){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else {
  document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
}

/* ------------------------------------------------------------ the vault
   A stack of bevelled plates. Released plates take the brand green, locked
   ones stay pale. Drag to turn it, drag the slider to move the price.     */
(function(){
  const canvas = document.getElementById("scene");
  const slider = document.getElementById("range");
  const LOW = 200, HIGH = 320, PLATES = 12;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function readout(){
    const v = Number(slider.value) / 100;
    const price = LOW + v * (HIGH - LOW);
    const pct = Math.round(v * 100);
    document.getElementById("price").textContent =
      "$" + price.toLocaleString(lang === "zh" ? "zh-CN" : "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById("pct").textContent = t("hero.released", { p: pct });
    slider.style.setProperty("--fill", pct + "%");
  }
  window.drawReadout = readout;
  slider.addEventListener("input", readout);
  readout();

  if (!window.THREE) return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 2.6, 9.4);
  camera.lookAt(0, 0.1, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xDCD9CE, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(5, 9, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xC9D6CF, 0.35); rim.position.set(-6, 3, -5); scene.add(rim);

  // a soft contact shadow, cheaper and calmer than a real shadow map
  // a feathered contact shadow: it fades to nothing, so no edge can ever show
  const shadowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, "rgba(10,10,10,0.22)");
    grad.addColorStop(0.45, "rgba(10,10,10,0.10)");
    grad.addColorStop(1, "rgba(10,10,10,0)");
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })();
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(6.4, 6.4),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -2.18;
  shadow.renderOrder = -1;
  scene.add(shadow);

  function plateShape(w, d, r){
    const s = new THREE.Shape();
    s.moveTo(-w + r, -d);
    s.lineTo(w - r, -d);
    s.absarc(w - r, -d + r, r, -Math.PI / 2, 0, false);
    s.lineTo(w, d - r);
    s.absarc(w - r, d - r, r, 0, Math.PI / 2, false);
    s.lineTo(-w + r, d);
    s.absarc(-w + r, d - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(-w, -d + r);
    s.absarc(-w + r, -d + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  const geo = new THREE.ExtrudeGeometry(plateShape(1.5, 1.5, 0.32), {
    depth: 0.2, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.05, bevelSegments: 2, curveSegments: 8
  });
  geo.rotateX(-Math.PI / 2);
  geo.center();

  const FREE = new THREE.Color(0x14764F);
  const LOCK = new THREE.Color(0xE9E8E2);
  const group = new THREE.Group();
  scene.add(group);

  const plates = [];
  const GAP = 0.36;
  for (let i = 0; i < PLATES; i++){
    const mat = new THREE.MeshStandardMaterial({ color: LOCK.clone(), roughness: 0.42, metalness: 0.04 });
    const m = new THREE.Mesh(geo, mat);
    const s = 1 - i * 0.016;
    m.scale.set(s, 1, s);
    m.position.y = i * GAP - (PLATES - 1) * GAP / 2;
    m.userData.baseY = m.position.y;
    m.userData.target = 0;
    m.userData.level = 0;
    group.add(m);
    plates.push(m);
  }

  function resize(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 520 ? 36 : 30;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  /* drag to turn */
  let spin = -0.5, spinTarget = -0.5, pitch = 0, pitchTarget = 0;
  let dragging = false, lastX = 0, lastY = 0, idle = 0;
  canvas.addEventListener("pointerdown", e => {
    dragging = true; idle = 0; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    spinTarget += (e.clientX - lastX) * 0.008;
    pitchTarget = Math.max(-0.35, Math.min(0.5, pitchTarget + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  const stop = e => { dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch {} };
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);

  let visible = true;
  if ("IntersectionObserver" in window){
    new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(canvas);
  }

  const start = performance.now();
  const easeOut = x => 1 - Math.pow(1 - x, 3);

  function frame(now){
    requestAnimationFrame(frame);
    if (!visible || document.hidden) return;

    const el = (now - start) / 1000;
    const intro = Math.min(1, Math.max(0, (el - 0.15) / 1.1));
    const filled = (Number(slider.value) / 100) * PLATES;

    plates.forEach((m, i) => {
      // entrance: plates drop into place one after the other
      const inn = reduce ? 1 : easeOut(Math.min(1, Math.max(0, (intro * PLATES - i * 0.55) / 1.6)));
      m.position.y = m.userData.baseY + (1 - inn) * 2.4;
      m.material.opacity = inn;
      m.material.transparent = inn < 1;

      const want = Math.max(0, Math.min(1, filled - i));
      m.userData.level += (want - m.userData.level) * 0.14;
      m.material.color.copy(LOCK).lerp(FREE, m.userData.level);
      // released plates sit a hair proud of the stack
      m.position.y += m.userData.level * 0.045;
    });

    if (!dragging){
      idle += 1 / 60;
      if (idle > 1.6 && !reduce) spinTarget += 0.0022;
    }
    spin += (spinTarget - spin) * 0.08;
    pitch += (pitchTarget - pitch) * 0.08;
    group.rotation.y = spin;
    group.rotation.x = pitch;
    if (!reduce) group.position.y = Math.sin(el * 0.55) * 0.055;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
